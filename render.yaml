databases:
  - name: mediflow-db
    databaseName: mediflow
    user: mediflow
    plan: free

services:
  - type: web
    name: mediflow
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm run db:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
